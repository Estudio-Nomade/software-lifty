# Manual OTA publish (EAS Update) for production channel.
# Requires repo secret EXPO_TOKEN (Expo access token). Does not auto-submit to Play.
name: EAS Update production

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app to update
        required: true
        default: both
        type: choice
        options:
          - both
          - driver
          - passenger
      message:
        description: Update message (conventional commit style preferred)
        required: true
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repo secret EXPO_TOKEN. Create an Expo access token and add it under Settings → Secrets."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: EAS Update driver
        if: inputs.app == 'driver' || inputs.app == 'both'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/eas-update.sh apps/mobile production "${{ inputs.message }}"

      - name: EAS Update passenger
        if: inputs.app == 'passenger' || inputs.app == 'both'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/eas-update.sh apps/mobile-passengers production "${{ inputs.message }}"
