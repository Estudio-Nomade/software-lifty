name: Deploy VPS

# CD del backend al VPS (api.liftyviajes.com).
# Se dispara cuando el CI de `main` termina en verde, o a mano desde la pestaña Actions.
# No hace checkout: el server hace `git fetch` y despliega el SHA exacto que pasó el CI
# (ver deploy/lightsail/ci-deploy.sh). Las migraciones NO se corren acá.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy ${{ env.SHA }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$VPS_USER@$VPS_HOST" "$SHA"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -m 15 https://api.liftyviajes.com/ready; then echo; exit 0; fi
            sleep 6
          done
          echo "api.liftyviajes.com/ready no respondió" >&2
          exit 1
